<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Assessment Demo</title>

    <!-- Respondus LockDown Browser Enforcement -->
    <script>
      (function () {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isLockDown = /LockDownBrowser|Respondus/i.test(ua);

        if (!isLockDown) {
          window.stop();
          document.documentElement.innerHTML = `
            <!DOCTYPE html>
            <html lang="en">
              <head>
                <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                <title>Access Restricted</title>
                <style>
                  body {
                    margin: 0;
                    padding: 1.5rem;
                    height: 100vh;
                    box-sizing: border-box;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background-color: #0f172a;
                    color: #f8fafc;
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                  }
                  .card {
                    background-color: #1e293b;
                    border: 1px solid #334155;
                    border-radius: 12px;
                    padding: 2.5rem;
                    max-width: 440px;
                    text-align: center;
                    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
                  }
                  h2 {
                    margin: 0 0 1rem;
                    color: #f87171;
                    font-size: 1.5rem;
                  }
                  p {
                    margin: 0 0 1.25rem;
                    color: #94a3b8;
                    font-size: 0.95rem;
                    line-height: 1.6;
                  }
                  .badge {
                    display: inline-block;
                    background-color: #334155;
                    color: #e2e8f0;
                    font-size: 0.8rem;
                    font-weight: 600;
                    padding: 0.4rem 0.8rem;
                    border-radius: 6px;
                    letter-spacing: 0.5px;
                  }
                </style>
              </head>
              <body>
                <div class="card">
                  <h2>Access Restricted</h2>
                  <p>This assessment requires <strong>Respondus LockDown Browser</strong>.</p>
                  <p>Please launch LockDown Browser on your device and navigate back to this URL to continue.</p>
                  <span class="badge">LockDown Browser Required</span>
                </div>
              </body>
            </html>
          `;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
